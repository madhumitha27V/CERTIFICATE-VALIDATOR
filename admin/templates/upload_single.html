<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single Marksheet Upload</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h3>Single Marksheet Upload</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="file" class="form-label">Select Image (JPEG/JPG/PNG)</label>
                <input type="file" class="form-control" id="file" name="file" accept=".jpeg,.jpg,.png" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">Back</a>
        </form>
        <div class="mt-4">
            <h6>Note:</h6>
            <p>The system will use OCR to extract details from the uploaded marksheet image.</p>
        </div>
    </div>
</body>
</html>
