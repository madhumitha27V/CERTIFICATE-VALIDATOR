services:
  - type: web
    name: certificate-validator-admin
    runtime: python3
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd admin && python app.py"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: PORT
        value: 10000
    disk:
      name: certificate-data
      mountPath: /opt/render/project/src
      sizeGB: 1