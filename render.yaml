services:
  - type: web
    name: certificate-validator-admin
    runtime: python3
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT app:app"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_DATABASE_PATH
        value: /opt/render/project/src/data/admin_database.db
      - key: USER_DATABASE_PATH
        value: /opt/render/project/src/data/user_database.db
    disk:
      name: certificate-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1